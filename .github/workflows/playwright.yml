name: Playwright BDD Sauce Demo Tests

on:
  push:
    branches: [ main, master, sub, feature-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps

      - name: Generate BDD Specs
        run: npx bddgen

      - name: Execute Playwright BDD Tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # 1. Generate Single-File Standalone Allure HTML Report
      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean --single-file -o allure-report

      # 2. Upload Standard Playwright HTML Report
      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 3. Upload Allure Report Artifact
      - name: Upload Allure Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30